# Render Blueprint: New > Blueprint > pick this repo. Builds the Dockerfile and redeploys on
# every push to main. DATABASE_URL is asked for once during setup.
services:
  - type: web
    name: slotbook
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # paste a Neon connection string when prompted
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      # Emails are printed to the logs until SMTP is configured:
      # set EMAIL_BACKEND=smtp plus SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, EMAIL_FROM.
      - key: EMAIL_BACKEND
        value: console
